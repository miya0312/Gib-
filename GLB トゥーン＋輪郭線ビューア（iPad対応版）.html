<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB トゥーンビューア（iPad対応版）</title>
<style>
:root{--bg:#e9edf2;--panel:#fffffff0;--text:#1b2430;--sub:#5b6776;--line:#c8d0da;--accent:#1f6feb;--on-accent:#fff;--err:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a2029;--panel:#232b36f0;--text:#e8edf3;--sub:#9aa7b6;--line:#3a4552;--accent:#5b9dff;--on-accent:#0b1118;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#1a2029;--panel:#232b36f0;--text:#e8edf3;--sub:#9aa7b6;--line:#3a4552;--accent:#5b9dff;--on-accent:#0b1118;--err:#ff8a80}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:440px;width:100%;box-sizing:border-box;line-height:1.6;font-size:14px}
#hint{display:flex;pointer-events:none;color:var(--sub);text-align:center;background:none;font-size:15px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#pct{font-size:28px;font-weight:700}#stg{color:var(--sub)}
#errT{color:var(--err);font-weight:700;font-size:16px}
#errD{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;max-height:34vh;overflow:auto}
#info{position:absolute;left:8px;top:8px;font-size:11px;color:var(--sub);background:var(--panel);padding:3px 8px;border-radius:8px;pointer-events:none;max-width:90%}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
#panel label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
#panel input[type=range]{width:100%;height:28px}
button,.btn,select{font:inherit;font-size:15px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);padding:0 12px}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.full{grid-column:1/-1}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <div id="info"></div>
  <div class="ov" id="hint">「GLBファイルを選ぶ」を押してください。<br>ファイルは外部に送信されません。</div>
  <div class="ov" id="prog"><div class="card"><div id="pct">0%</div><div class="bar"><i id="barI"></i></div><div id="stg">準備中</div><div class="row"><button id="cancel">中止</button></div></div></div>
  <div class="ov" id="err"><div class="card"><div id="errT"></div><div id="errM" style="margin-top:6px"></div><div id="errD"></div>
   <div class="row"><button id="retryLow" class="primary">低負荷で再試行</button><button id="errClose">閉じる</button></div></div></div>
 </div>
 <div id="panel">
  <label class="btn primary full">GLBファイルを選ぶ<input id="file" type="file"></label>
  <label>負荷モード<select id="perf"><option value="auto" selected>自動</option><option value="normal">通常</option><option value="low">低負荷</option></select></label>
  <label>表示<select id="mode"><option value="toon" selected>トゥーン＋輪郭線</option><option value="toonNoLine">トゥーンのみ</option><option value="orig">元の質感（簡易・比較）</option></select></label>
  <label>影の段数／濃さ<span style="display:flex;gap:6px"><select id="steps" style="width:64px"><option>2</option><option selected>3</option><option>4</option></select><input id="shadow" type="range" min="0" max="80" value="45"></span></label>
  <label>輪郭線の太さ<input id="thick" type="range" min="0" max="60" value="18"></label>
  <button id="reset" class="full">視点リセット</button>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
/*PARSER_START*/
function parseGLB(buf){

 var off=12,json=null,bin=-1;

  if(t===0x4E4F534A)json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,off+8,l)));

 if(bin<0)throw new Error('GLB内にバイナリチャンクがありません（外部ファイル参照の.gltf系は非対応）。');

var NC={SCALAR:1,VEC2:2,VEC3:3,VEC4:4};
function accessor(g,i){
 var a=g.json.accessors[i];if(!a||a.bufferView==null)throw new Error('accessor '+i+' に bufferView がありません。');

/*PARSER_END*/
var $=function(id){return document.getElementById(id)};

var renderer,scene,camera,dirty=true,root=null,meshes=[],texCache={},curFile=null,runId=0,lowActive=false,autoRetried=false;
var sph={theta:0,phi:Math.PI/2,r:3},tgt=new THREE.Vector3(),homeR=3,homeT=new THREE.Vector3();
var lineMat,grad=null,lastFile=0;
function tick(){return new Promise(function(r){setTimeout(r,16)})}
function showOv(id,on){$(id).style.display=on?'flex':'none'}
function prog(p,s){p=Math.max(0,Math.min(100,p));$('pct').textContent=Math.round(p)+'%';$('barI').style.width=p+'%';$('stg').textContent=s}
function fail(title,e,stage){

 var gl=renderer&&renderer.getContext();
 $('errD').textContent=['段階: '+(stage||'不明'),'ファイル: '+(curFile?curFile.name+' ('+(curFile.size/1048576).toFixed(1)+'MB)':'-'),'モード: '+(lowActive?'低負荷':'通常'),

}
function withTimeout(p,ms,label){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error(label+'が '+(ms/1000)+' 秒以内に終わりませんでした（端末メモリ不足の可能性）。'))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}

  r.onerror=function(){clearInterval(w);rej(new Error('ファイルを読み込めませんでした：'+(r.error&&r.error.message||'不明')))};

  var tx=new THREE.Texture(src);tx.flipY=false;tx.encoding=THREE.sRGBEncoding;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.anisotropy=low?1:4;tx.needsUpdate=true;tx.userData={w:w,h:h};return tx;
 });

function disposeRoot(){
 if(!root)return;scene.remove(root);
 root.traverse(function(o){if(o.isMesh){if(o.geometry)o.geometry.dispose();['toon','std'].forEach(function(k){var m=o.userData[k];if(m){if(m.map)m.map.dispose();m.dispose()}})}});

}
function makeGrad(n,s){var lo=Math.round(255*(1-s)),d=new Uint8Array(n);for(var i=0;i<n;i++)d[i]=Math.round(lo+(255-lo)*i/(n-1));var t=new THREE.DataTexture(d,n,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t}
function applyStyle(){
 if(!root)return;var mode=$('mode').value;
 if(grad)grad.dispose();grad=makeGrad(+$('steps').value,+$('shadow').value/100);
 lineMat.uniforms.thick.value=+$('thick').value/10000;
 meshes.forEach(function(m){var u=m.userData;
  if(mode==='orig'){if(!u.std)u.std=new THREE.MeshStandardMaterial({map:u.map,color:u.map?0xffffff:0xbbbbbb,roughness:.8,metalness:0});m.material=u.std}
  else{if(!u.toon)u.toon=new THREE.MeshToonMaterial({map:u.map,color:u.map?0xffffff:0xbbbbbb});u.toon.gradientMap=grad;u.toon.needsUpdate=true;m.material=u.toon}
  u.line.visible=(mode==='toon');});

}
function setSize(){var st=$('stage'),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;renderer.setPixelRatio(lowActive?1:Math.min(window.devicePixelRatio||1,2));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true}
function updCam(){var s=Math.sin(sph.phi);camera.position.set(tgt.x+sph.r*s*Math.sin(sph.theta),tgt.y+sph.r*Math.cos(sph.phi),tgt.z+sph.r*s*Math.cos(sph.theta));camera.lookAt(tgt);dirty=true}
function resetView(){sph.theta=0;sph.phi=Math.PI/2;sph.r=homeR;tgt.copy(homeT);updCam()}
function nodeMat(n){var m=new THREE.Matrix4();if(n.matrix)m.fromArray(n.matrix);else m.compose(new THREE.Vector3().fromArray(n.translation||[0,0,0]),new THREE.Quaternion().fromArray(n.rotation||[0,0,0,1]),new THREE.Vector3().fromArray(n.scale||[1,1,1]));return m}
async function load(file,perf){

  var big=file.size>10*1048576,low=(perf==='low')||(perf==='auto'&&IOS&&big);

   try{maps[mi]=await decodeTex(g,mats[mi],low)}catch(e){maps[mi]=null;console.warn(e);$('info').dataset.warn='テクスチャ読込失敗: '+e.message}

  $('info').textContent=nv.toLocaleString()+' 頂点 / '+Math.round(nt).toLocaleString()+' 三角形 / テクスチャ '+(tw?tw.userData.w+'px':'なし')+' / 推定 '+Math.round(bytes/1048576*2+texMB*2)+'MB / '+(low?'低負荷':'通常')+' / 初回描画 '+Math.round(dt)+'ms'+($('info').dataset.warn?' / ⚠'+$('info').dataset.warn:'');

}
function init(){

   if(pd>0&&nd>0)sph.r=Math.max(homeR*0.15,Math.min(homeR*4,sph.r*pd/nd));pd=nd;

 function up(e){delete ptr[e.pointerId]}el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 el.addEventListener('wheel',function(e){e.preventDefault();sph.r=Math.max(homeR*0.15,Math.min(homeR*4,sph.r*Math.exp(e.deltaY*0.001)));updCam()},{passive:false});
 window.addEventListener('resize',setSize);setSize();
 ['steps','shadow','thick','mode'].forEach(function(k){$(k).addEventListener('input',applyStyle)});
 $('reset').onclick=resetView;
 $('file').onchange=function(e){var f=e.target.files&&e.target.files[0];if(f){autoRetried=false;load(f,$('perf').value)}e.target.value=''};
 $('perf').onchange=function(){if(curFile){autoRetried=true;load(curFile,$('perf').value)}};
 $('cancel').onclick=function(){runId++;showOv('prog',false);showOv('hint',!root)};
 $('errClose').onclick=function(){showOv('err',false);showOv('hint',!root)};
 $('retryLow').onclick=function(){showOv('err',false);if(curFile){$('perf').value='low';autoRetried=true;load(curFile,'low')}};
 window.addEventListener('error',function(e){fail('予期しないエラー',e.message,'実行時')});
 window.addEventListener('unhandledrejection',function(e){fail('予期しないエラー',e.reason,'実行時')});
 showOv('hint',true);
 (function loop(){requestAnimationFrame(loop);if(dirty&&root){dirty=false;renderer.render(scene,camera)}})();
}
